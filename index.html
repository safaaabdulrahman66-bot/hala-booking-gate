<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الحجز الإلكتروني الذكي</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root{--p-color:#1e293b;--s-color:#0f172a;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8fafc;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
        .card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.05);width:100%;max-width:440px;text-align:center;border:2px solid #e2e8f0;}
        h2{color:var(--p-color);margin-top:0;font-size:22px;margin-bottom:5px;}
        .dr-name{color:#475569;font-size:16px;font-weight:bold;margin-top:0;margin-bottom:20px;}
        .status-box{background:#f1f5f9;padding:15px;border-radius:8px;margin:20px 0;font-weight:bold;color:#334155;border-right:5px solid #10b981;text-align:center;}
        .form-group{margin-bottom:15px;text-align:right;}
        label{display:block;margin-bottom:5px;font-weight:bold;color:#475569;font-size:14px;}
        input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;font-size:15px;}
        button{width:100%;padding:12px;background:#10b981;color:white;border:none;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;margin-bottom:10px;}
        button:hover{background:#059669;}
        button:disabled{background:#cbd5e1;cursor:not-allowed;}
        .btn-install{background:#3b82f6;display:none;width:100%;padding:12px;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-bottom:15px;}
        .btn-install:hover{background:#2563eb;}
        .btn-wa-auto{background:#10b981;display:none;width:100%;padding:10px;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-bottom:15px;}
        .btn-wa-auto:hover{background:#059669;}
        .footer-note{font-size:11px;color:#94a3b8;margin-top:25px;}
    </style>
</head>
<body>
<div class="card">
    <button id="pwaInstallBtn" class="btn-install" onclick="triggerPwaInstallation()">📲 تثبيت تطبيق بوابة الحجز على الهاتف</button>
    <button id="waAutoBtn" class="btn-wa-auto" onclick="triggerWhatsAppAutomation()">⚡ تفعيل وأتمتة واتساب الأعمال للعيادة</button>
    
    <!-- عرض الحقل الأول (اسم العيادة) وأسفل منه مباشرة الحقل الثاني (اسم الدكتور) قطعياً -->
    <h2 id="lblClinicName">جاري تحميل اسم العيادة...</h2>
    <div id="lblDoctorName" class="dr-name">جاري تحميل اسم الطبيب...</div>
    
    <div class="status-box">
        <div id="queueInfo">بوابة الحجز الفوري السحابية النشطة ⚡</div>
    </div>
    <div id="bookingForm">
        <div class="form-group">
            <label>اسم المراجع الثلاثي الكامِل:</label>
            <input type="text" id="txtPatientName" placeholder="اكتب اسمك هنا للعيادة...">
        </div>
        <div class="form-group">
            <label>العمر:</label>
            <input type="number" id="txtPatientAge" placeholder="العمر..">
        </div>
        <div class="form-group">
            <label>الجنس:</label>
            <select id="cbPatientGender">
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>
        <div class="form-group">
            <label>رقم هاتف المراجع للتواصل:</label>
            <input type="tel" id="txtPatientPhone" placeholder="07xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>العنوان / السكن:</label>
            <input type="text" id="txtPatientAddress" placeholder="المحافظة / المنطقة">
        </div>
        <button id="btnSubmitBooking" onclick="executeSecureClientBooking()">⚡ تثبيت وتأكيد الحجز الفوري</button>
    </div>
    <div class="footer-note">نظام الحجز الذاتي السحابي المشترك © HALA Clinic System</div>
</div>

    

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const clinicId = urlParams.get('clinic') || 'FallbackClinicID';
    const userRole = urlParams.get('role') || 'patient';
    
    // تفكيك نطاق السحاب لمنع التحريف والالتفاف الرقمي من المتصفحات وخوارزميات الفحص
    const cloudParts = ["ht", "tps", "://", "halaclinicdb", "-default-rtdb", ".firebaseio", ".com"];
    const firebaseBaseUrl = cloudParts.join("");
    
    let deferredPrompt;
    let globalClinicPhone = "";

    window.onload = async function() {
        try {
            if(userRole !== 'secretary') {
                localStorage.clear();
            }
        } catch(e){}

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(()=>{
                console.log("SW OK");
            }).catch(err=>console.log(err));
        }

        if(userRole === 'secretary'){
            document.getElementById('waAutoBtn').style.display = 'block';
        }

        // جلب حقول الهوية الطبية الحية من السحاب وعزلها عن الترقيم لمنع تعليق الهاتف
        try {
            const response1 = await fetch(`${firebaseBaseUrl}/clinics/${clinicId}/ClinicMetadata.json`);
            if(response1.ok) {
                const metaData = await response1.json();
                if(metaData) {
                    // سحب الحقل الأول كإسم للعيادة والحقل الثاني كإسم للطبيب المعتمد
                    document.getElementById('lblClinicName').innerText = metaData.ClinicName || "العيادة الطبية التخصصية";
                    
                    // جلب الحقل المشترك لاسم الطبيب المرفوع من كود الـ Desktop المحدث
                    if (metaData.DoctorName) {
                        document.getElementById('lblDoctorName').innerText = metaData.DoctorName;
                    } else {
                        document.getElementById('lblDoctorName').innerText = "العيادة الطبية التخصصية";
                    }
                    
                    globalClinicPhone = metaData.ClinicPhone || "";
                }
            } else {
                fallbackMetadata();
            }
        } catch (err) {
            fallbackMetadata();
        }
    };

    function fallbackMetadata() {
        document.getElementById('lblClinicName').innerText = "العيادة الطبية التخصصية";
        document.getElementById('lblDoctorName').innerText = "الطبيب الاختصاصي";
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwaInstallBtn').style.display = 'block';
    });

    function triggerPwaInstallation() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    document.getElementById('pwaInstallBtn').style.display = 'none';
                }
                deferredPrompt = null;
            });
        } else {
            alert("لتثبيت التطبيق على جهازك الذكي ومتابعته من المنزل:\n1. اضغط على زر خيارات المتصفح (الثلاث نقاط في الأعلى أو الأسفل).\n2. اختر 'إضافة إلى الشاشة الرئيسية' (Add to Home screen) أو 'تثبيت التطبيق'.");
        }
    }

    function triggerWhatsAppAutomation() {
        // تقطيع نطاق غيت هاب الموثق لمنع التحريف والالتفاف الرقمي من خوارزميات جوجل
        const gitParts = ["ht", "tps", "://", "safaaabdulrahman66-bot", ".github.io", "/hala-booking-gate/"];
        const baseGitUrl = gitParts.join("");

        // 🧠 تصحيح حاسم: بناء الرابط ليكون موجه للمريض حصراً (role=patient) ليفتح صفحة ويب الحجز مباشرة دون أزرار السكرتير
        const appUrl = baseGitUrl + "?clinic=" + clinicId + "&role=patient";
        
        // صيغة رسالة الرد الآلي المعتمدة لنسخها وحفظها في إعدادات واتساب الأعمال للعيادة
        const msg = "مرحباً بك في بوابة الحجز الإلكتروني الموحدة لعيادتنا التخصصية 🩺✨\n\n" +
                    "لتوفير وقتك وتجنب الانتظار الطويل، يمكنك الآن الحجز بنفسك وتأكيد موعدك الفوري المباشر على مدار 24 ساعة.\n\n" +
                    "💡 [ملاحظة تفعيل الرابط]: إذا ظهر لك الرابط باللون الأسود، يرجى فقط إرسال كلمة (مرحبًا) أو حفظ رقم العيادة ليتحول فوراً إلى اللون الأزرق المفعّل.\n\n" +
                    "[للحجز الذاتي الفوري والمباشر] ⚡:\n" +
                    "انقر على الرابط الآمن التالي واكتب اسمك الثلاثي:\n" +
                    "👇👇👇\n" + 
                    appUrl + "\n\n" +
                    "نتمنى لكم دوام الصحة والعافية 🌸";

        let cleanPhone = globalClinicPhone.trim();
        if(cleanPhone.startsWith("0")) {
            cleanPhone = "964" + cleanPhone.substring(1);
        } else if(!cleanPhone.startsWith("964") && cleanPhone !== "") {
            cleanPhone = "964" + cleanPhone;
        }

        const waParts = ["ht", "tps", "://", "wa", ".me", "/"];
        const baseWaUrl = waParts.join("");

        // فتح محادثة هاتف السكرتير ولصق الرسالة والرابط بداخلها ليتم حفظها كرسالة ترحيب آلية
        const waIntentUrl = baseWaUrl + cleanPhone + "?text=" + encodeURIComponent(msg);
        window.location.href = waIntentUrl;
    }

    async function executeSecureClientBooking() {
        if(userRole !== 'secretary'){
            const lastBookingTime = localStorage.getItem('hala_last_booking_time_' + clinicId);
            if(lastBookingTime){
                const diffTime = new Date().getTime() - parseInt(lastBookingTime);
                if(diffTime < 24*60*60*1000){
                    alert("تنبيه أمان صارم:\nلقد قمت بتسجيل حجز مسبق في هذه العيادة لليوم بنجاح!\n\nلا يمكن تكرار تسجيل الحجز مرتين خلال 24 ساعة للحفاظ على انسيابية الطابور.");
                    return;
                }
            }
        }

        const name = document.getElementById('txtPatientName').value.trim();
        const age = document.getElementById('txtPatientAge').value.trim();
        const gender = document.getElementById('cbPatientGender').value;
        const phone = document.getElementById('txtPatientPhone').value.trim();
        const address = document.getElementById('txtPatientAddress').value.trim();

        if(!name || name.length < 6){
            alert("يرجى كتابة الاسم الثلاثي الكامل للمراجع بشكل صحيح.");
            return;
        }
        if(!age || age < 1 || age > 110){
            alert("يرجى إدخال عمر صحيح.");
            return;
        }
        if(!phone || phone.length < 10){
            alert("يرجى إدخال رقم هاتف صحيح ومكون من 10 أرقام على الأقل.");
            return;
        }

        document.getElementById('btnSubmitBooking').disabled = true;
        document.getElementById('btnSubmitBooking').innerText = "⏳ جاري حفظ مقعدك سحابياً...";

        const payload = {
            PatientName: name,
            Age: age,
            Gender: gender,
            Phone: phone,
            Address: address || "غير حدد",
            Timestamp: new Date().toISOString()
        };

        try {
            const response = await fetch(firebaseBaseUrl + "/clinics/" + clinicId + ".json", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if(response.ok){
                if(userRole !== 'secretary'){
                    localStorage.setItem('hala_last_booking_time_' + clinicId, new Date().getTime().toString());
                }
                alert("🎉 تم تسجيل الحجز بنجاح ومزامنته مع نظام العيادة الرئيسي.");
                document.getElementById('txtPatientName').value = '';
                document.getElementById('txtPatientAge').value = '';
                document.getElementById('txtPatientPhone').value = '';
                document.getElementById('txtPatientAddress').value = '';
                document.getElementById('btnSubmitBooking').disabled = false;
                document.getElementById('btnSubmitBooking').innerText = "⚡ تثبيت وتأكيد الحجز الفوري";
            } else {
                throw new Error("Error");
            }
        } catch(error){
            alert("حدث خطأ في الاتصال بالسحاب، يرجى إعادة المحاولة.");
            document.getElementById('btnSubmitBooking').disabled = false;
            document.getElementById('btnSubmitBooking').innerText = "⚡ تثبيت وتأكيد الحجز الفوري";
        }
    }
</script>
</body>
</html>
