<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الحجز المباشر 🩺</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #1e222d;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #059669;
        }
        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>طلب حجز موعد جديد 🩺</h2>
    
    <div class="form-group">
        <label for="txtPatientName">اسم المريض الكامل:</label>
        <input type="text" id="txtPatientName" placeholder="أدخل الاسم الثلاثي">
    </div>

    <div class="form-group">
        <label for="txtAge">العمر:</label>
        <input type="number" id="txtAge" placeholder="مثال: 30">
    </div>

    <div class="form-group">
        <label for="cbGender">الجنس:</label>
        <select id="cbGender">
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
        </select>
    </div>

    <div class="form-group">
        <label for="txtPhone">رقم الهاتف:</label>
        <input type="tel" id="txtPhone" placeholder="07xxxxxxxx">
    </div>

    <div class="form-group">
        <label for="txtAddress">العنوان / السكن:</label>
        <input type="text" id="txtAddress" placeholder="المحافظة / المنطقة">
    </div>

    <button id="btnSubmit" onclick="sendAppointmentToCloud()">تأكيد وإرسال الحجز ⚡</button>
    
    <div id="statusMessage" class="status-msg"></div>
</div>

<script>
    // 🚀 الخوارزمية العالمية لالتقاط كود العيادة من الرابط دون تداخل أو اختفاء
    function getFirebaseTargetUrl() {
        // قراءة المعاملات البرمجية من الرابط القياسي ?clinic=
        const urlParams = new URLSearchParams(window.location.search);
        const clinicId = urlParams.get('clinic');

        // الرابط الأساسي الثابت لمشروع الـ Firebase الخاص بك
        const baseFirebaseUrl = "https://halaclinicdb-default-rtdb.firebaseio.com/";

        // 1. إذا التقط الهاتف كود العيادة بنجاح، يقوم ببناء مسار الـ JSON المباشر والمعزول تجارياً فوراً
        if (clinicId && clinicId.trim() !== "") {
            return `${baseFirebaseUrl}/clinics/${clinicId.trim()}.json`;
        }

        // 2. إذا فتحت الملف محلياً للتجربة أو حدث تحويل تلقائي، يوجه لملف فحص احتياطي لكي لا تظهر الشاشة الحمراء
        console.log("تنبيه: تم التحول للمسار الاحتياطي لعدم توفر معرّف عيادة في الرابط الحالي.");
        return `${baseFirebaseUrl}/clinics/Clinic_Default_Test.json`;
    }

    async function sendAppointmentToCloud() {
        const firebaseURL = getFirebaseTargetUrl();
        const statusDiv = document.getElementById("statusMessage");
        const btn = document.getElementById("btnSubmit");

        // جلب البيانات من عناصر الحقول
        const name = document.getElementById("txtPatientName").value.trim();
        const age = document.getElementById("txtAge").value.trim();
        const gender = document.getElementById("cbGender").value;
        const phone = document.getElementById("txtPhone").value.trim();
        const address = document.getElementById("txtAddress").value.trim();

        // التحقق الصارم من إدخال الاسم
        if (!name) {
            alert("يرجى إدخال اسم المريض الكامل.");
            return;
        }

        // بناء مجسم البيانات الفريد بالتناسق مع صمامات أمان السيرفر
        const appointmentData = {
            PatientName: name,
            Age: age ? age : "0",
            Gender: gender,
            Phone: phone ? phone : "---",
            Address: address ? address : "غير محدد"
        };

        btn.disabled = true;
        btn.innerText = "جاري إرسال البيانات...";

        try {
            // إرسال البيانات إلى عقدة Firebase المخصصة لهذه العيادة حصراً
            const response = await fetch(firebaseURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(appointmentData)
            });

            if (response.ok) {
                statusDiv.style.display = "block";
                statusDiv.style.color = "green";
                statusDiv.innerText = "✨ تم إرسال الحجز بنجاح! سيظهر في طابور العيادة فوراً.";
                
                // تصفير الحقول بعد النجاح
                document.getElementById("txtPatientName").value = "";
                document.getElementById("txtAge").value = "";
                document.getElementById("txtPhone").value = "";
                document.getElementById("txtAddress").value = "";
            } else {
                throw new Error("فشل الاستجابة من السيرفر");
            }
        } catch (error) {
            statusDiv.style.display = "block";
            statusDiv.style.color = "red";
            statusDiv.innerText = "❌ فشل الاتصال بالسحاب، يرجى التحقق من الإنترنت.";
        } finally {
            btn.disabled = false;
            btn.innerText = "تأكيد وإرسال الحجز ⚡";
        }
    }
</script>

</body>
</html>
