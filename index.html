<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>بوابة الحجز الإلكتروني الذكي</title> <link rel="manifest" href="./manifest.json"> <style> :root{--p-color:#1e293b;--s-color:#0f172a;} body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8fafc;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;} .card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.05);width:100%;max-width:440px;text-align:center;border:2px solid #e2e8f0;} h2{color:var(--p-color);margin-top:0;font-size:22px;} .status-box{background:#f1f5f9;padding:15px;border-radius:8px;margin:20px 0;font-weight:bold;color:#334155;border-right:5px solid #3b82f6;text-align:right;} .form-group{margin-bottom:15px;text-align:right;} label{display:block;margin-bottom:5px;font-weight:bold;color:#475569;font-size:14px;} input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;font-size:15px;} button{width:100%;padding:12px;background:#10b981;color:white;border:none;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;margin-bottom:10px;} button:hover{background:#059669;} button:disabled{background:#cbd5e1;cursor:not-allowed;} .btn-install{background:#3b82f6;display:none;width:100%;padding:10px;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-bottom:10px;} .btn-install:hover{background:#2563eb;} .btn-wa-auto{background:#10b981;display:none;width:100%;padding:10px;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-bottom:15px;} .btn-wa-auto:hover{background:#059669;} .footer-note{font-size:11px;color:#94a3b8;margin-top:25px;} </style> </head> <body> <div class="card"> <button id="pwaInstallBtn" class="btn-install" onclick="triggerPwaInstallation()">📲 تثبيت تطبيق بوابة الحجز على الهاتف</button> <button id="waAutoBtn" class="btn-wa-auto" onclick="triggerWhatsAppAutomation()">⚡ تفعيل وأتمتة واتساب الأعمال للعيادة</button> <h2 id="lblClinicName">العيادة الطبية التخصصية</h2> <p style="color:#64748b;font-size:13px;" id="lblClinicPhone">نظام الحجز الذاتي المشترك</p> <div class="status-box"> <div id="queueInfo">حالة الاتصال: متصل بالسحاب للعيادة ⚡</div> </div> <div id="bookingForm"> <div class="form-group"> <label>اسم المراجع الثلاثي الكامِل:</label> <input type="text" id="txtPatientName" placeholder="اكتب اسمك هنا للعيادة..."> </div> <div class="form-group"> <label>العمر:</label> <input type="number" id="txtPatientAge" placeholder="العمر.."> </div> <div class="form-group"> <label>الجنس:</label> <select id="cbPatientGender"> <option value="ذكر">ذكر</option> <option value="أنثى">أنثى</option> </select> </div> <div class="form-group"> <label>رقم هاتف المراجع للتواصل:</label> <input type="tel" id="txtPatientPhone" placeholder="07xxxxxxxxx"> </div> <div class="form-group"> <label>العنوان / السكن:</label> <input type="text" id="txtPatientAddress" placeholder="المحافظة / المنطقة"> </div> <button id="btnSubmitBooking" onclick="executeSecureClientBooking()">⚡ تثبيت وتأكيد الحجز الفوري</button> </div> <div class="footer-note">نظام الحجز الذاتي السحابي المشترك © HALA Clinic System</div> </div> <script> const urlParams=new URLSearchParams(window.location.search);const clinicId=urlParams.get('clinic')||'FallbackClinicID';const userRole=urlParams.get('role')||'patient';const p1="ht"+"tps:/";const p2="/halac"+"linicdb-de";const p3="fault-r"+"tdb.fi";const p4="rebas"+"eio.co"+"m";const firebaseBaseUrl=p1+p2+p3+p4;let deferredPrompt;window.onload=function(){try{localStorage.clear();}catch(e){}if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>{console.log("SW OK");}).catch(err=>console.log(err));}if(userRole==='secretary'){document.getElementById('waAutoBtn').style.display='block';}fetchClinicDataAndMetadata();};window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('pwaInstallBtn').style.display='block';});function triggerPwaInstallation(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then((choiceResult)=>{if(choiceResult.outcome==='accepted'){document.getElementById('pwaInstallBtn').style.display='none';}deferredPrompt=null;});}}function triggerWhatsAppAutomation(){const appUrl="https://safaaabdulrahman66-bot.github.io/hala-booking-gate/?clinic="+encodeURIComponent(clinicId);const msg="مرحباً بك في بوابة الحجز الإلكتروني الموحدة لعيادتنا التخصصية 🩺✨

لتوفير وقتك وتجنب الانتظار الطويل، يمكنك الآن الحجز بنفسك وتأكيد حجزك الفوري المباشر على مدار 24 ساعة.

1️⃣ [للحجز الذاتي الفوري والمباشر] ⚡:
انقر على الرابط الآمن التالي واكتب اسمك الثلاثي:
👇👇👇
"+appUrl+"

2️⃣ [للتحدث مع السكرتارية أو الاستفسار] 👤:
اكتب تفاصيل استفسارك في رسالة واحدة هنا، وسيقوم السكرتير بالرد عليك فور بدء الدوام الرسمي للعيادة.

نتمنى لكم دوام الصحة والعافية 🌸";const waIntentUrl="whatsapp://biz_settings_greeting?text="+encodeURIComponent(msg);window.location.href=waIntentUrl;}async function fetchClinicDataAndMetadata(){try{const metaRes=await fetch(firebaseBaseUrl+"/clinics/"+clinicId+"/ClinicMetadata.json");if(metaRes.ok){const metaData=await metaRes.json();if(metaData){if(metaData.ClinicName)document.getElementById('lblClinicName').innerText=metaData.ClinicName;if(metaData.ClinicPhone)document.getElementById('lblClinicPhone').innerText="رقم الحجز: "+metaData.ClinicPhone;}}}catch(e){}}async function executeSecureClientBooking(){if(userRole!=='secretary'){const lastBookingTime=localStorage.getItem('hala_last_booking_time_'+clinicId);if(lastBookingTime){const diffTime=new Date().getTime()-parseInt(lastBookingTime);if(diffTime<24*60*60*1000){alert("تنبيه أمان صارم:
لقد قمت بتسجيل حجز مسبق في هذه العيادة لليوم بنجاح!

لا يمكن تكرار تسجيل الحجز مرتين خلال 24 ساعة للحفاظ على انسيابية الطابور.");return;}}}const name=document.getElementById('txtPatientName').value.trim();const age=document.getElementById('txtPatientAge').value.trim();const gender=document.getElementById('cbPatientGender').value;const phone=document.getElementById('txtPatientPhone').value.trim();const address=document.getElementById('txtPatientAddress').value.trim();if(!name||name.length<6){alert("يرجى كتابة الاسم الثلاثي الكامل للمراجع بشكل صحيح.");return;}if(!age||age<1||age>110){alert("يرجى إدخال عمر صحيح.");return;}if(!phone||phone.length<10){alert("يرجى إدخال رقم هاتف صحيح ومكون من 10 أرقام.");return;}document.getElementById('btnSubmitBooking').disabled=true;document.getElementById('btnSubmitBooking').innerText="⏳ جاري حفظ مقعدك سحابياً...";const payload={PatientName:name,Age:age,Gender:gender,Phone:phone,Address:address||"غير محدد",Timestamp:new Date().toISOString()};try{const response=await fetch(firebaseBaseUrl+"/clinics/"+clinicId+".json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(response.ok){if(userRole!=='secretary'){localStorage.setItem('hala_last_booking_time_'+clinicId,new Date().getTime().toString());}alert("🎉 تم تسجيل الحجز بنجاح ");document.getElementById('txtPatientName').value='';document.getElementById('txtPatientAge').value='';document.getElementById('txtPatientPhone').value='';document.getElementById('txtPatientAddress').value='';document.getElementById('btnSubmitBooking').disabled=false;document.getElementById('btnSubmitBooking').innerText="⚡ تثبيت وتأكيد الحجز الفوري";}else{throw new Error("Error");}}catch(error){alert("حدث خطأ، يرجى إعادة المحاولة.");document.getElementById('btnSubmitBooking').disabled=false;document.getElementById('btnSubmitBooking').innerText="⚡ تثبيت وتأكيد الحجز الفوري";}} </script> </body> </html>
