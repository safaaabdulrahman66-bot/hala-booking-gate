<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الحجز الإلكتروني الذكي</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--p-color:#1e293b;--s-color:#0f172a;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8fafc;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.05);width:100%;max-width:440px;text-align:center;border:2px solid #e2e8f0;}
h2{color:var(--p-color);margin-top:0;font-size:22px;}
.status-box{background:#f1f5f9;padding:15px;border-radius:8px;margin:20px 0;font-weight:bold;color:#334155;border-right:5px solid #3b82f6;text-align:right;}
.form-group{margin-bottom:15px;text-align:right;}
label{display:block;margin-bottom:5px;font-weight:bold;color:#475569;font-size:14px;}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;font-size:15px;}
button{width:100%;padding:12px;background:#10b981;color:white;border:none;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;margin-bottom:10px;}
button:hover{background:#059669;}
button:disabled{background:#cbd5e1;cursor:not-allowed;}
.footer-note{font-size:11px;color:#94a3b8;margin-top:25px;}
</style>
</head>
<body>
<div class="card">
<h2 id="lblClinicName">العيادة الطبية التخصصية</h2>
<p style="color:#64748b;font-size:13px;" id="lblClinicPhone">نظام الحجز الذاتي المشترك</p>
<div class="status-box">
<div id="queueInfo">حالة الاتصال: متصل بالسحاب للعيادة ⚡</div>
<div id="expectedSeq" style="margin-top:8px;color:#10b981;font-size:17px;">التسلسل المتاح للحجز الآن: [ جاري الحساب ]</div>
</div>
<div id="bookingForm">
<div class="form-group">
<label>اسم المراجع الثلاثي الكامِل:</label>
<input type="text" id="txtPatientName" placeholder="اكتب اسمك هنا للعيادة...">
</div>
<div class="form-group">
<label>العمر:</label>
<input type="number" id="txtPatientAge" placeholder="العمر..">
</div>
<div class="form-group">
<label>الجنس:</label>
<select id="cbPatientGender">
<option value="ذكر">ذكر</option>
<option value="أنثى">أنثى</option>
</select>
</div>
<div class="form-group">
<label>رقم هاتف المراجع للتواصل:</label>
<input type="tel" id="txtPatientPhone" placeholder="07xxxxxxxxx">
</div>
<div class="form-group">
<label>العنوان / السكن:</label>
<input type="text" id="txtPatientAddress" placeholder="المحافظة / المنطقة">
</div>
<button id="btnSubmitBooking" onclick="executeSecureClientBooking()">⚡ تثبيت وتأكيد الحجز الفوري</button>
</div>
<div class="footer-note">نظام الحجز الذاتي السحابي المشترك © HALA Clinic System</div>
</div>
<script>
const urlParams=new URLSearchParams(window.location.search);
const clinicId=urlParams.get('clinic')||'FallbackClinicID';
const p1="ht"+"tps:/";const p2="/halac"+"linicdb-de";const p3="fault-r"+"tdb.fi";const p4="rebas"+"eio.co"+"m";
const firebaseBaseUrl=p1+p2+p3+p4;
let currentLiveMaxSeq=0;let expectedNextSeq=1;
window.onload=function(){
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>{console.log("SW OK");}).catch(err=>console.log(err));}
verifyClientPreviousBookingStatus();fetchClinicDataAndMetadata();
};
function verifyClientPreviousBookingStatus(){const lastBookingDate=localStorage.getItem(`Hala_Block_${clinicId}`);const todayStr=new Date().toLocaleDateString('en-CA');if(lastBookingDate===todayStr){document.getElementById('bookingForm').innerHTML=`<div style="padding:20px;background:#fef2f2;color:#b91c1c;border-radius:8px;font-weight:bold;">⚠️ حظر التكرار: لقد قمت بتسجيل حجز مسبق في هذه العيادة لليوم بنجاح!</div>`;}}
async function fetchClinicDataAndMetadata(){try{const response=await fetch(`${firebaseBaseUrl}/clinics/${clinicId}.json`);if(response.ok){const allData=await response.json();let count=0;if(allData){count=Object.keys(allData).length;currentLiveMaxSeq=count;}expectedNextSeq=currentLiveMaxSeq+1;document.getElementById('expectedSeq').innerText=`تسلسلك المتوقع في الطابور هو: (${expectedNextSeq})`;}}catch(e){document.getElementById('expectedSeq').innerText=`التسلسل المتاح للحجز الآن: (1)`;}}
async function executeSecureClientBooking(){const name=document.getElementById('txtPatientName').value.trim();const age=document.getElementById('txtPatientAge').value.trim();const gender=document.getElementById('cbPatientGender').value;const phone=document.getElementById('txtPatientPhone').value.trim();const address=document.getElementById('txtPatientAddress').value.trim();if(!name||name.length<6){alert("يرجى كتابة الاسم الثلاثي الكامل للمراجع بشكل صحيح.");return;}if(!age||age<1||age>110){alert("يرجى إدخال عمر صحيح.");return;}if(!phone||phone.length<10){alert("يرجى إدخال رقم هاتف صحيح ومكون من 10 أرقام.");return;}document.getElementById('btnSubmitBooking').disabled=true;document.getElementById('btnSubmitBooking').innerText="⏳ جاري حفظ مقعدك سحابياً...";const payload={PatientName:name,Age:age,Gender:gender,Phone:phone,Address:address||"غير محدد",Timestamp:new Date().toISOString()};try{const response=await fetch(`${firebaseBaseUrl}/clinics/${clinicId}.json`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(response.ok){const todayStr=new Date().toLocaleDateString('en-CA');localStorage.setItem(`Hala_Block_${clinicId}`,todayStr);document.getElementById('bookingForm').innerHTML=`<div style="padding:20px;background:#d1fae5;color:#065f46;border-radius:8px;font-weight:bold;margin-bottom:15px;">🎉 تم تثبيت وتأكيد حجزك بنجاح في العيادة!<br>رقمك المخصص في طابور الانتظار هو: [ ${expectedNextSeq} ]</div>`;}else{throw new Error("Error");}}catch(error){alert("حدث خطأ، يرجى إعادة المحاولة.");document.getElementById('btnSubmitBooking').disabled=false;document.getElementById('btnSubmitBooking').innerText="⚡ تثبيت وتأكيد الحجز الفوري";}}
</script>
</body>
</html>
